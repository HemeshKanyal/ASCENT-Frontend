# Render Blueprint for the ASCENT landing site (static, free, never sleeps).
# The site imports the app's engine (src/engine), so it rebuilds when either changes.
services:
  - type: web
    name: ascent-site
    runtime: static
    branch: main
    rootDir: website
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - website/**
        - src/engine/**
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
